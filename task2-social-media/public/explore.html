<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore & Discover — AlphaSocial</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">
    <!-- Left Navigation -->
    <aside class="sidebar-nav">
      <a href="/" class="brand-title">
        <i class="fas fa-bolt"></i>
        <span>AlphaSocial</span>
      </a>

      <a href="/" class="nav-item">
        <i class="fas fa-home"></i>
        <span>Home Feed</span>
      </a>

      <a href="/explore.html" class="nav-item active">
        <i class="fas fa-compass"></i>
        <span>Explore</span>
      </a>

      <a href="/profile.html" class="nav-item my-profile-link">
        <i class="fas fa-user"></i>
        <span>Profile</span>
      </a>

      <button id="auth-action-btn" class="nav-item" style="background:none; border:none; width:100%; text-align:left; cursor:pointer;">
        <i class="fas fa-sign-in-alt"></i>
        <span>Sign In</span>
      </button>

      <button onclick="openCreatePostModal()" class="btn-create-post-nav">
        <i class="fas fa-pen-nib"></i> <span>Create Post</span>
      </button>
    </aside>

    <!-- Center Search & Discover -->
    <main class="feed-column">
      <div style="background:white; border-radius:var(--radius); padding:1.5rem; border:1px solid var(--border); margin-bottom:1.5rem; box-shadow:var(--shadow);">
        <h2 style="font-size:1.4rem; font-weight:800; margin-bottom:1rem;">Explore AlphaSocial</h2>
        <div style="position:relative;">
          <input type="text" id="explore-search" placeholder="Search by hashtag #WebDev, keywords or topic..." oninput="handleExploreSearch(event)" style="width:100%; padding:0.75rem 1rem 0.75rem 2.8rem; border:1px solid var(--border); border-radius:9999px; outline:none; font-size:0.95rem;">
          <i class="fas fa-search" style="position:absolute; left:1.1rem; top:50%; transform:translateY(-50%); color:var(--muted);"></i>
        </div>
      </div>

      <!-- Search results -->
      <div id="posts-stream">
        <div style="text-align: center; padding: 3rem;"><i class="fas fa-spinner fa-spin fa-2x" style="color:var(--primary);"></i></div>
      </div>
    </main>

    <!-- Right Column -->
    <aside class="sidebar-widgets">
      <div class="widget-card">
        <h3 class="widget-title"><i class="fas fa-user-plus" style="color:var(--primary); margin-right:0.4rem;"></i> Suggested Creators</h3>
        <div id="suggested-users-list"></div>
      </div>
    </aside>
  </div>

  <script src="js/app.js"></script>
  <script src="js/feed.js"></script>
  <script>
    function handleExploreSearch(e) {
      const q = e.target.value.trim();
      const container = document.getElementById('posts-stream');
      const headers = {};
      if (SocialAuth.isLoggedIn()) headers['Authorization'] = `Bearer ${SocialAuth.getToken()}`;

      fetch(`/api/posts?search=${encodeURIComponent(q)}`, { headers })
        .then(res => res.json())
        .then(data => renderPosts(data.posts || []))
        .catch(err => console.error(err));
    }
  </script>
</body>
</html>
