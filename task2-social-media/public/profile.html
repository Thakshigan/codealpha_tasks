<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile — AlphaSocial</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">
    <!-- Left Navigation Column -->
    <aside class="sidebar-nav">
      <a href="/" class="brand-title">
        <i class="fas fa-bolt"></i>
        <span>AlphaSocial</span>
      </a>

      <a href="/" class="nav-item">
        <i class="fas fa-home"></i>
        <span>Home Feed</span>
      </a>

      <a href="/explore.html" class="nav-item">
        <i class="fas fa-compass"></i>
        <span>Explore</span>
      </a>

      <a href="/profile.html" class="nav-item active my-profile-link">
        <i class="fas fa-user"></i>
        <span>Profile</span>
      </a>

      <button id="auth-action-btn" class="nav-item" style="background:none; border:none; width:100%; text-align:left; cursor:pointer;">
        <i class="fas fa-sign-in-alt"></i>
        <span>Sign In</span>
      </button>

      <button onclick="openCreatePostModal()" class="btn-create-post-nav">
        <i class="fas fa-pen-nib"></i> <span>Create Post</span>
      </button>
    </aside>

    <!-- Center Profile Column -->
    <main class="feed-column" id="profile-layout">
      <div style="text-align: center; padding: 4rem;"><i class="fas fa-spinner fa-spin fa-2x" style="color:var(--primary);"></i></div>
    </main>

    <!-- Right Column (Who to follow) -->
    <aside class="sidebar-widgets">
      <div class="widget-card">
        <h3 class="widget-title"><i class="fas fa-user-plus" style="color:var(--primary); margin-right:0.4rem;"></i> Who to Follow</h3>
        <div id="suggested-users-list"></div>
      </div>
    </aside>
  </div>

  <script src="js/app.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/feed.js"></script>
</body>
</html>
