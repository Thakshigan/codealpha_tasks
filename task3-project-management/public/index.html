<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlphaPM — Collaborative Project Management</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Navigation -->
  <header>
    <div class="nav-wrap">
      <a href="/" class="brand-logo">
        <i class="fas fa-layer-group"></i>
        <span>Alpha<span>PM</span></span>
      </a>

      <div style="display: flex; align-items: center; gap: 1.2rem;">
        <button onclick="openCreateProjectModal()" class="btn-primary" style="padding: 0.5rem 1.1rem; font-size: 0.88rem;">
          <i class="fas fa-plus"></i> New Project
        </button>
        <div id="nav-auth-section"></div>
      </div>
    </div>
  </header>

  <!-- Main Dashboard Content -->
  <main class="dashboard-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
      <div>
        <h1 style="font-size: 1.8rem; font-weight: 800;">Workspace Projects</h1>
        <p style="color: var(--muted); font-size: 0.95rem;">Track progress, manage sprints, and assign tasks with real-time Kanban boards.</p>
      </div>
    </div>

    <!-- Projects Grid -->
    <div id="projects-list" class="projects-grid">
      <div style="grid-column: 1/-1; text-align: center; padding: 4rem;"><i class="fas fa-spinner fa-spin fa-2x" style="color:var(--primary);"></i></div>
    </div>
  </main>

  <!-- Create Project Modal -->
  <div id="create-project-modal" class="modal-backdrop">
    <div class="modal-card">
      <button onclick="closeCreateProjectModal()" style="position: absolute; right: 1.2rem; top: 1.2rem; background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--muted);">&times;</button>
      <h2 style="font-size: 1.3rem; font-weight: 800; margin-bottom: 1.2rem;">Create Team Project</h2>

      <form onsubmit="handleCreateProject(event)">
        <div class="form-group">
          <label class="form-label">Project Title *</label>
          <input type="text" id="proj-title" class="form-input" placeholder="e.g. Website Overhaul Sprint 1" required>
        </div>

        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea id="proj-desc" class="form-textarea" rows="3" placeholder="Goals, scope, and objectives..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Board Accent Color</label>
          <select id="proj-color" class="form-select">
            <option value="#4f46e5">Indigo (#4f46e5)</option>
            <option value="#06b6d4">Cyan (#06b6d4)</option>
            <option value="#10b981">Emerald (#10b981)</option>
            <option value="#f59e0b">Amber (#f59e0b)</option>
            <option value="#ec4899">Pink (#ec4899)</option>
          </select>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; padding: 0.75rem;">Create Project</button>
      </form>
    </div>
  </div>

  <!-- Sign In Modal -->
  <div id="auth-modal" class="modal-backdrop">
    <div class="modal-card">
      <button onclick="closeAuthModal()" style="position: absolute; right: 1.2rem; top: 1.2rem; background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--muted);">&times;</button>
      <h2 style="font-size: 1.3rem; font-weight: 800; margin-bottom: 1.2rem;">Sign In to AlphaPM</h2>

      <form onsubmit="event.preventDefault(); handlePMLogin();">
        <div class="form-group">
          <label class="form-label">Work Email</label>
          <input type="email" id="pm-email" class="form-input" placeholder="emily@team.com" value="emily@team.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="pm-password" class="form-input" placeholder="••••••••" value="team123" required>
        </div>
        <p style="font-size:0.8rem; color:var(--muted); margin-bottom:1rem;">Team credentials: <code>emily@team.com</code> or <code>liam@team.com</code> (pwd: <code>team123</code>)</p>
        <button type="submit" class="btn-primary" style="width: 100%; padding: 0.75rem;">Sign In</button>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    async function handlePMLogin() {
      const email = document.getElementById('pm-email').value.trim();
      const pwd = document.getElementById('pm-password').value.trim();
      const ok = await PMAuth.login(email, pwd);
      if (ok) {
        closeAuthModal();
        loadProjectsDashboard();
      }
    }
  </script>
</body>
</html>
