<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Board — AlphaPM</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body style="height: 100vh; overflow: hidden; display: flex; flex-direction: column;">

  <!-- Header -->
  <header>
    <div class="nav-wrap">
      <div style="display: flex; align-items: center; gap: 1.5rem;">
        <a href="/" class="brand-logo">
          <i class="fas fa-layer-group"></i>
          <span>Alpha<span>PM</span></span>
        </a>
        <a href="/" style="color: var(--slate); text-decoration: none; font-weight: 600; font-size: 0.9rem;">
          <i class="fas fa-arrow-left"></i> All Projects
        </a>
      </div>

      <div id="nav-auth-section"></div>
    </div>
  </header>

  <!-- Board Meta Bar -->
  <div class="board-header">
    <div>
      <div style="display: flex; align-items: center; gap: 0.8rem;">
        <h1 id="board-project-title" style="font-size: 1.4rem; font-weight: 800;">Loading Board...</h1>
        <span style="background: #ecfdf5; color: var(--success); font-size: 0.75rem; font-weight: 800; padding: 0.2rem 0.6rem; border-radius: 9999px; display: flex; align-items: center; gap: 0.3rem;">
          <span style="width: 6px; height: 6px; background: var(--success); border-radius: 50%; display: inline-block;"></span> LIVE SYNC
        </span>
      </div>
      <p id="board-project-desc" style="color: var(--muted); font-size: 0.85rem; margin-top: 0.2rem;"></p>
    </div>

    <div style="display: flex; gap: 0.8rem;">
      <button onclick="openCreateTaskModal('todo')" class="btn-primary" style="padding: 0.55rem 1rem; font-size: 0.88rem;">
        <i class="fas fa-plus"></i> Add Task
      </button>
      <button onclick="const el=document.getElementById('activity-sidebar'); el.style.display = el.style.display==='none'?'block':'none';" style="background: white; border: 1px solid var(--border); padding: 0.55rem 0.9rem; border-radius: 8px; font-weight: 600; cursor: pointer; color: var(--slate); font-size: 0.88rem;">
        <i class="fas fa-history"></i> Activity
      </button>
    </div>
  </div>

  <!-- Main Kanban Board Canvas -->
  <div style="display: flex; flex: 1; overflow: hidden;" id="kanban-board-container">
    <div class="board-container">
      
      <!-- TO DO Column -->
      <div class="kanban-column">
        <div class="column-header" style="border-top: 3px solid #64748b;">
          <div class="column-title"><i class="far fa-circle" style="color:#64748b;"></i> To Do</div>
          <span class="column-badge" id="count-todo">0</span>
        </div>
        <div class="cards-container" id="cards-container-todo" data-status="todo"></div>
        <button class="btn-add-card" onclick="openCreateTaskModal('todo')"><i class="fas fa-plus"></i> Add Card</button>
      </div>

      <!-- IN PROGRESS Column -->
      <div class="kanban-column">
        <div class="column-header" style="border-top: 3px solid var(--primary);">
          <div class="column-title"><i class="fas fa-spinner" style="color:var(--primary);"></i> In Progress</div>
          <span class="column-badge" id="count-in_progress">0</span>
        </div>
        <div class="cards-container" id="cards-container-in_progress" data-status="in_progress"></div>
        <button class="btn-add-card" onclick="openCreateTaskModal('in_progress')"><i class="fas fa-plus"></i> Add Card</button>
      </div>

      <!-- IN REVIEW Column -->
      <div class="kanban-column">
        <div class="column-header" style="border-top: 3px solid var(--warning);">
          <div class="column-title"><i class="fas fa-eye" style="color:var(--warning);"></i> In Review</div>
          <span class="column-badge" id="count-review">0</span>
        </div>
        <div class="cards-container" id="cards-container-review" data-status="review"></div>
        <button class="btn-add-card" onclick="openCreateTaskModal('review')"><i class="fas fa-plus"></i> Add Card</button>
      </div>

      <!-- DONE Column -->
      <div class="kanban-column">
        <div class="column-header" style="border-top: 3px solid var(--success);">
          <div class="column-title"><i class="fas fa-check-circle" style="color:var(--success);"></i> Done</div>
          <span class="column-badge" id="count-done">0</span>
        </div>
        <div class="cards-container" id="cards-container-done" data-status="done"></div>
        <button class="btn-add-card" onclick="openCreateTaskModal('done')"><i class="fas fa-plus"></i> Add Card</button>
      </div>

    </div>

    <!-- Collapsible Activity Drawer -->
    <aside id="activity-sidebar" style="width: 280px; background: white; border-left: 1px solid var(--border); padding: 1.2rem; overflow-y: auto; display: none;">
      <h3 style="font-size: 1rem; font-weight: 800; margin-bottom: 1rem;"><i class="fas fa-stream"></i> Board Activity</h3>
      <div id="activity-logs-list"></div>
    </aside>
  </div>

  <!-- Create Task Modal -->
  <div id="create-task-modal" class="modal-backdrop">
    <div class="modal-card">
      <button onclick="closeCreateTaskModal()" style="position: absolute; right: 1.2rem; top: 1.2rem; background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--muted);">&times;</button>
      <h2 style="font-size: 1.3rem; font-weight: 800; margin-bottom: 1.2rem;">Create Task Card</h2>

      <form id="create-task-form" onsubmit="handleCreateTask(event)">
        <input type="hidden" id="new-task-status" value="todo">

        <div class="form-group">
          <label class="form-label">Task Title *</label>
          <input type="text" id="new-task-title" class="form-input" placeholder="e.g. Implement payment webhook" required>
        </div>

        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea id="new-task-desc" class="form-textarea" rows="3" placeholder="Add acceptance criteria or technical notes..."></textarea>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label">Priority</label>
            <select id="new-task-priority" class="form-select">
              <option value="low">🟢 Low</option>
              <option value="medium" selected>🔵 Medium</option>
              <option value="high">🟠 High</option>
              <option value="urgent">🔴 Urgent</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Assignee</label>
            <select id="new-task-assignee" class="form-select">
              <option value="">Unassigned</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Due Date</label>
          <input type="date" id="new-task-due" class="form-input">
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; padding: 0.75rem;">Add Card to Column</button>
      </form>
    </div>
  </div>

  <!-- Task Detail & Comment Modal -->
  <div id="task-detail-modal" class="modal-backdrop">
    <div class="modal-card" style="max-width: 540px;">
      <button onclick="document.getElementById('task-detail-modal').classList.remove('active')" style="position: absolute; right: 1.2rem; top: 1.2rem; background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--muted);">&times;</button>
      <div id="task-detail-body">
        <!-- Injected by board.js -->
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/board.js"></script>
</body>
</html>
