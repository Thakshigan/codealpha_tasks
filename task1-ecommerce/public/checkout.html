<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout & Order Processing — AlphaStore</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Navigation -->
  <header>
    <div class="container nav-container">
      <a href="/" class="brand-logo">
        <i class="fas fa-cubes"></i>
        <div>Alpha<span>Store</span></div>
      </a>

      <div class="nav-links">
        <a href="/cart.html" class="nav-link"><i class="fas fa-arrow-left"></i> Return to Cart</a>
        <div id="nav-auth-container"></div>
      </div>
    </div>
  </header>

  <!-- Checkout Content -->
  <main class="container" style="padding-top: 2.5rem; max-width: 1050px;">
    <div id="checkout-box">
      <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 2rem;">Secure Checkout</h1>

      <div style="display: grid; grid-template-columns: 1.4fr 1fr; gap: 2.5rem; align-items: flex-start;">
        <!-- Shipping & Payment Form -->
        <form onsubmit="handlePlaceOrder(event)" style="background: white; padding: 2rem; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow-sm);">
          <h3 style="font-size: 1.2rem; font-weight: 800; margin-bottom: 1.2rem; display: flex; align-items: center; gap: 0.5rem;">
            <i class="fas fa-truck" style="color:var(--primary);"></i> 1. Shipping Information
          </h3>

          <div class="form-group">
            <label class="form-label">Full Name *</label>
            <input type="text" id="ship-name" class="form-control" placeholder="John Doe" required>
          </div>

          <div class="form-group">
            <label class="form-label">Email Address for Confirmation *</label>
            <input type="email" id="ship-email" class="form-control" placeholder="john@example.com" required>
          </div>

          <div class="form-group">
            <label class="form-label">Street Address *</label>
            <input type="text" id="ship-address" class="form-control" placeholder="123 Alpha Boulevard, Suite 400" required>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label class="form-label">City *</label>
              <input type="text" id="ship-city" class="form-control" placeholder="San Francisco" required>
            </div>
            <div class="form-group">
              <label class="form-label">Postal / ZIP Code *</label>
              <input type="text" id="ship-zip" class="form-control" placeholder="94105" required>
            </div>
          </div>

          <h3 style="font-size: 1.2rem; font-weight: 800; margin: 2rem 0 1.2rem; display: flex; align-items: center; gap: 0.5rem; border-top: 1px solid var(--border); padding-top: 1.5rem;">
            <i class="fas fa-credit-card" style="color:var(--primary);"></i> 2. Payment Method
          </h3>

          <div style="display: flex; flex-direction: column; gap: 0.8rem; margin-bottom: 1.5rem;">
            <label style="display: flex; align-items: center; gap: 0.8rem; padding: 0.9rem; border: 1.5px solid var(--primary); border-radius: 8px; background: #eef2ff; cursor: pointer;">
              <input type="radio" name="payment_method" value="Credit Card" checked>
              <strong>Credit / Debit Card (Simulated)</strong>
              <span style="margin-left: auto; color: var(--primary);"><i class="fab fa-cc-visa fa-lg"></i> <i class="fab fa-cc-mastercard fa-lg"></i></span>
            </label>

            <label style="display: flex; align-items: center; gap: 0.8rem; padding: 0.9rem; border: 1px solid var(--border); border-radius: 8px; cursor: pointer;">
              <input type="radio" name="payment_method" value="PayPal">
              <strong>PayPal Express</strong>
              <span style="margin-left: auto; color: #2563eb;"><i class="fab fa-paypal fa-lg"></i></span>
            </label>

            <label style="display: flex; align-items: center; gap: 0.8rem; padding: 0.9rem; border: 1px solid var(--border); border-radius: 8px; cursor: pointer;">
              <input type="radio" name="payment_method" value="Cash On Delivery">
              <strong>Cash on Delivery (COD)</strong>
              <span style="margin-left: auto; color: var(--muted);"><i class="fas fa-money-bill-wave fa-lg"></i></span>
            </label>
          </div>

          <button type="submit" id="place-order-btn" class="btn-block" style="font-size: 1.05rem; padding: 0.9rem;">
            <i class="fas fa-lock"></i> Place Order & Complete
          </button>
        </form>

        <!-- Order Summary Sidebar -->
        <div style="background: white; padding: 1.8rem; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow-sm); position: sticky; top: 90px;">
          <h3 style="font-size: 1.15rem; font-weight: 800; margin-bottom: 1.2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.6rem;">Items in Order</h3>
          <div id="checkout-items-summary">
            <!-- Populated by checkout.js -->
          </div>

          <div id="checkout-cost-breakdown" style="margin-top: 1.2rem;">
            <!-- Populated by checkout.js -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer style="margin-top: 5rem;">
    <div class="container footer-bottom">
      &copy; 2026 AlphaStore — CodeAlpha Full Stack Development Project.
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
