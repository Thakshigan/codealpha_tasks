<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders & Tracking — AlphaStore</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Navigation -->
  <header>
    <div class="container nav-container">
      <a href="/" class="brand-logo">
        <i class="fas fa-cubes"></i>
        <div>Alpha<span>Store</span></div>
      </a>

      <div class="nav-links">
        <a href="/" class="nav-link"><i class="fas fa-shopping-bag"></i> Shop</a>
        <a href="/cart.html" class="cart-btn-nav">
          <i class="fas fa-shopping-bag"></i>
          <span>Cart</span>
          <span class="cart-badge" style="display: none;">0</span>
        </a>
        <div id="nav-auth-container"></div>
      </div>
    </div>
  </header>

  <!-- Orders Content -->
  <main class="container" style="padding-top: 2.5rem; max-width: 900px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
      <h1 style="font-size: 2rem; font-weight: 800;">My Order History</h1>
      <button onclick="loadMyOrders()" style="background: white; border: 1px solid var(--border); padding: 0.5rem 1rem; border-radius: 8px; font-weight: 600; cursor: pointer; color: var(--slate);">
        <i class="fas fa-sync-alt"></i> Refresh
      </button>
    </div>

    <div id="orders-container">
      <!-- Populated by orders.js -->
    </div>
  </main>

  <footer>
    <div class="container footer-bottom">
      &copy; 2026 AlphaStore — CodeAlpha Full Stack Development Project.
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
